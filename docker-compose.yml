version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg16  # This image includes PostgreSQL with pgvector pre-installed
    container_name: pgvector-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales-sustainability
    ports:
      - "5000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: